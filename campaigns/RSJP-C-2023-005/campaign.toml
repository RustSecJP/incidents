id = "RSJP-C-2023-005"
title = "利用者 gabielle55131 が公開した、Windows でマルウェアを動かす名前の偽装 crate 2 つ（2023年11月）"
summary = """
crates.io の利用者 gabielle55131 が、Tauri の Windows 通知 crate（tauri-winrt-notification） に名前を似せた 2 つの crate を公開した。RustSec の助言によると、Windows のホストで任意のマルウェアを動かすためのもの。
2023 年 11 月に削除され、利用者は使えなくされたが、当時は公表されなかったようで、RustSec の助言は 2026-03-26 にまとめて登録された。
版、ダウンロード数、公開日、ペイロードの中身は記録が残っていないか、公開されていない。
"""
