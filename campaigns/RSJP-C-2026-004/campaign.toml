description = """
Rust のセキュリティ対応チームは、aovine、arone、aronenao、tinymember を proc-macro1 と同じ事件の crate として削除し、確かめ方の対象に含めた。
RustSec の助言（arone、aronenao）は「arrayref の利用者を狙った攻撃の一部」と明記している。
ただし、本体との具体的なつながり（依存関係、公開者、通信先）は公表されておらず、arone / aronenao が悪性だったかは RustSec と Socket で食い違う。
"""
