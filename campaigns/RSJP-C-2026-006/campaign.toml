id = "RSJP-C-2026-006"
title = "同じ利用者が 2026 年 1 月〜2 月に公開し、ビルド環境の情報を外部へ送ろうとした electrumd と gabby-types-sec（2026年11月削除）"
summary = """
electrumd（2026-01 に 5 版）と gabby-types-sec（2026-02 に 1 版、版番号 99.99.99）は、ビルド環境の情報（RustSec の言う telemetry）を任意の URL へ送ろうとしたとして、2026 年 11 月に削除された。
lib.rs の記録では、2 つとも同じ crates.io の利用者が持っていた。electrumd は、GitHub 上にある同じ名前の正規のプロジェクトと名前が重なる。
送信先、送る中身、目的（攻撃か、調査のための試しか）は公表されていない。
"""
status = "published"
related = [] # 関連するキャンペーン番号

[dates] # すべて UTC
first_malicious_publish = "2026-01-26" # electrumd（RustSec の助言による。lib.rs は 2026-01-23 と表示。時刻は不明）
discovered = "2026-11"                 # Bitbison の通報（日付は公表されていない。助言の日付は 2026-11-09）
removed = "2026-11"                    # 削除の日時は公表されていない。2026-11-20 に索引に無いことを確認

[[members]]
crate = "electrumd"
versions = "5 版（RustSec は 2026-01-26 に公開とする。lib.rs は 0.0.1〜0.0.4 と 0.1.0、すべて Jan 23, 2026 と表示）"
role = "carrier" # GitHub 上の同じ名前の正規のプロジェクト（crates.io 外）と名前が重なる
ids = ["RUSTSEC-2026-0465"] # GHSA と MAL の番号は 2026-11-20 時点で見つからない
downloads = "実利用の形跡なし（RustSec）"

