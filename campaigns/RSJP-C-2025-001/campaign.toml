[[links]]
kind = "same-target-and-structure"
description = """
第 1 波と第 2 波のつながり: どちらも finch 系の crate を装い、「装う crate ＋ 認証情報を盗む sha-* という名前の依存」という同じ構成をとる。
名前も sha-rust → sha-rst、finch-rust → finch-rst と 1 文字違いで、第 2 波は第 1 波の削除の 3 日後に公開された。
ただし、公開した利用者が同じかどうか、送信先が同じかどうかは公表されておらず、同じ攻撃者によるものとは確認できていない。
"""
