id = "RSJP-C-2025-001"
title = "finch を装う crate と、認証情報を盗む sha-* 依存（2025年11月〜12月）"
summary = """
ゲノム解析ツールの crate `finch` / `finch_cli` に名前を似せた crate が、認証情報を外部へ送る別の crate に依存する形で crates.io に公開された。
2025-12-05 に 2 つ（finch-rust、sha-rust）が削除され、その 3 日後に同じ構成の 3 つ（finch-rst、sha-rst、finch_cli_rust）が公開されて、再び削除された。
"""
status = "published"
related = [] # 関連するキャンペーン番号

[dates] # すべて UTC
first_malicious_publish = "2025-11-20" # sha-rust の最初の版（crates.io チームの報告による。時刻は不明）
discovered = "2025-12-05"              # Socket から crates.io チームへの通報
removed = "2025-12-05T15:52:00Z"       # 第 1 波の削除。第 2 波の削除時刻は公表されていない

# ---- 第 1 波 ----
[[members]]
crate = "sha-rust"
versions = "8 版（2025-11-20〜2025-11-25 に公開）"
role = "carrier"   # 認証情報を盗む本体
ids = ["RUSTSEC-2025-0146", "GHSA-3mmg-7c2q-8938"]
downloads = 153

[[members]]
