versions = "1 版（2025-11-25 に公開）"
role = "typosquat" # finch を装い、sha-rust に依存する
ids = ["RUSTSEC-2025-0148", "GHSA-f8h5-x737-x4xr"]
downloads = 28

# ---- 第 2 波 ----
