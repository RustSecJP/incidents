id = "RSJP-C-2026-002"
title = "時刻ユーティリティを装い、timeapi.io に似せた送信先へ .env を送る crate（2026年2月〜3月）"
summary = """
時刻の調整や同期の道具を装った 5 つの crate が、手元の .env ファイルを外部へ送るコードを含んでいた。
送信先は、正規の時刻 API サービス timeapi.io に 1 文字足した、よく似た名前のドメインだった（timeapi.io 自体は無関係）。
2026-02-28〜03-04 に公開され、4 つは公開から数時間以内、最後の chrono_anchor は 03-10 に Socket の通報で削除された。
"""
