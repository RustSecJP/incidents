id = "RSJP-C-2025-003"
title = "同じ利用者が 2025 年 3 月に公開し、ビルド環境の情報を外部へ送ろうとした 4 つの crate（2025年3月公開、2026年11月削除）"
summary = """
top_level_crate、shinchina、shinchina-test、build_dep の 4 つは、2025-03-01〜03-03 に公開され、ビルド環境の情報（RustSec の言う telemetry）を任意の URL へ送ろうとしたとして、約 20 か月後の 2026 年 11 月に削除された。
lib.rs の記録では、4 つとも同じ crates.io の利用者が持っていた。top_level_crate と build_dep は、cargo-cyclonedx のテスト用の crate と同じ名前である。
送信先、送る中身、目的（攻撃か、調査のための試しか）は公表されていない。
"""
