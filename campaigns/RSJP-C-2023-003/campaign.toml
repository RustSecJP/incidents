id = "RSJP-C-2023-003"
title = "利用者 Kraded が公開した、Windows でマルウェアを動かす名前の偽装 crate 12 個（2023年11月）"
summary = """
crates.io の利用者 Kraded が、Windows 向けの道具や Monero（暗号資産）関連の crate に名前を似せた 12 個の crate を公開した。RustSec の助言によると、Windows のホストで任意のマルウェアを動かすためのもの。
2023 年 11 月に削除され、利用者は使えなくされたが、当時は公表されなかったようで、RustSec の助言は 2026-03-26 にまとめて登録された。
版、ダウンロード数、公開日、ペイロードの中身は記録が残っていないか、公開されていない。
"""
