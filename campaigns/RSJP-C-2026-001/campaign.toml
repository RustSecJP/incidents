id = "RSJP-C-2026-001"
title = "polymarket-client-sdk を装う crate と、Polymarket の認証情報を狙う一連の公開（2026年2月）"
summary = """
Polymarket の公式 Rust クライアント `polymarket-client-sdk` の周りで、名前を似せた悪性の crate 9 つが 2026-02-05〜02-26 に次々と公開され、認証情報（環境変数 POLYMARKET_PRIVATE_KEY を含む）を盗もうとした。
RustSec の助言は 10 件（rpc-check は 2 回公開されたため 2 件）。後の 6 件は本文で「進行中のキャンペーンの一部」と明記している。
前の 4 件は同じ crate を装うことと助言の記述から束ねたが、確信度は中。
"""
