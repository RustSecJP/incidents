id = "RSJP-C-2023-001"
title = "有名な crate を装い、build.rs でホストの情報を Telegram へ送る crate（2023年8月）"
summary = """
利用者 amaperf が、lazy_static、cfg-if、env_logger、once_cell、serde、postgres などに名前を似せた crate を crates.io に公開した。
最初はほぼ空の版を出し、2023-08-16 の版で build.rs を足して、ビルド時に IP アドレス、国と地域、OS の種類を Telegram のチャンネルへ送るようにした。
同じ日に Phylum の通報で取り下げられ、08-18 に完全に削除された。RustSec の助言は 2026-03 に後から記録された。
"""
status = "published"
related = ["RSJP-C-2023-002"] # 手口の説明と通報者が同じだけで、同じキャンペーンとは扱わない

[dates] # すべて UTC
first_malicious_publish = "2023-08-16" # build.rs 入りの最初の版（xrvrv 0.1.1、Phylum の表で 14:48。時間帯は記事に書かれていない）。ほぼ空の最初の版は 2023-08-14
discovered = "2023-08-16"              # Phylum から Rust Foundation と crates.io チームへの通報
removed = "2023-08-18T17:22:00Z"       # static.crates.io からの完全な削除（crates.io チーム）。取り下げとアカウントのロックは 08-16

