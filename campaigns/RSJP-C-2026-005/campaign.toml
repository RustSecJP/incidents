id = "RSJP-C-2026-005"
title = "greentic-setup と greentic-setup-dev に混入した PolinRider の亜種（2026年9月）"
summary = """
正規の crate `greentic-setup` と `greentic-setup-dev` に、PolinRider と呼ばれるマルウェアの亜種を含む版が 1 つずつ公開された（RustSec によると、依存するプロジェクトを VS Code で開くと動く）。
2 つの版は、元のリポジトリの research ブランチが同じ日時・同じメッセージのコミットで書き換えられた直後に、プロジェクト自身の GitHub Actions の同じ実行から公開された。
2026-09-06 に公開され、約 27 時間後に削除された。悪いのは greentic-setup 1.3.1-dev.34027618345 と greentic-setup-dev 1.3.34027618345 だけ。
"""
status = "published"
related = [] # 関連するキャンペーン番号

[dates] # すべて UTC
first_malicious_publish = "2026-09-06" # RustSec の助言による。GitHub Actions の公開の手順は 13:31〜13:32 に動いた（公開時刻そのものは未確認）
discovered = "2026-09-07"              # Nextron Systems の研究チームの通報。正確な時刻は不明（助言の報告日）
removed = "2026-09-07"                 # 公開から約 27 時間後（RustSec の助言による）。正確な時刻は不明

[[members]]
